<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sunshine Custom Builders</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side routing, so a direct hit on a route
      // like /kitchen-remodeling 404s here. This redirects it back to
      // index.html with the intended path encoded in the query string; a
      // matching script in index.html restores the real URL before the app
      // mounts. See https://github.com/rafgraph/spa-github-pages.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
